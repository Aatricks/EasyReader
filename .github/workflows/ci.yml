name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      # Skip keystore decoding on pull requests since secrets are unavailable
      if: github.event_name != 'pull_request'
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
        echo "storeFile=../app/release.jks" > keystore.properties
        echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint with Gradle
      run: ./gradlew lintStandardDebug lintAiDebug

    - name: Run unit tests
      run: ./gradlew testStandardDebugUnitTest testAiDebugUnitTest

    - name: Build with Gradle
      # PRs use unsigned debug builds to validate changes without requiring signing secrets.
      # Trusted events (push to main) use signed release builds with decoded secrets.
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "Building debug APKs for PR..."
          ./gradlew assembleDebug
        else
          echo "Building release APKs for trusted event..."
          ./gradlew assembleRelease
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-apks
        path: |
          app/build/outputs/apk/*/debug/*.apk
          app/build/outputs/apk/*/release/*.apk
