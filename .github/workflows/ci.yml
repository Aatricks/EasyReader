name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_release:
        description: "Run signed release build"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 6 * * 1"

jobs:
  standard-validation:
    name: standard-validation
    runs-on: ubuntu-latest
    # Keep PR and main push validation strictly unsigned standardDebug checks.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate standardDebug
      # PR/default validation path with no release/signing requirements.
      run: ./gradlew :app:lintStandardDebug :app:testStandardDebugUnitTest :app:detekt :app:assembleStandardDebug

  android-instrumented-test:
    name: android-instrumented-test
    runs-on: ubuntu-latest
    # KVM-enabled hosted runner image. Only runs on main push / scheduled / manual
    # so PR CI stays fast; the emulator pull and boot adds ~5 minutes per run.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests (API 30)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: aosp_atd
        arch: x86_64
        profile: pixel_5
        emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: ./gradlew :app:connectedStandardDebugAndroidTest

  benchmark-smoke:
    name: benchmark-smoke
    runs-on: ubuntu-latest
    # Emulator results validate journeys and preserve trend data, but release decisions use
    # the physical reference device because emulator timing and graphics metrics are synthetic.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run release-derived benchmark smoke (API 34)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: aosp_atd
        arch: x86_64
        profile: pixel_5
        emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: ./gradlew :benchmark:connectedStandardBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

    - name: Record APK and native-library sizes
      if: always()
      run: |
        mkdir -p benchmark-ci
        for apk in app/build/outputs/apk/standard/benchmarkRelease/*.apk; do
          apk_bytes=$(stat -c%s "$apk")
          native_bytes=$(unzip -l "$apk" | awk '$4 ~ /^lib\/.*\.so$/ { total += $1 } END { print total + 0 }')
          echo "$(basename "$apk") apk_bytes=$apk_bytes native_bytes=$native_bytes" >> benchmark-ci/artifact-sizes.txt
        done

    - name: Upload benchmark evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: standard-benchmark-smoke
        if-no-files-found: warn
        path: |
          benchmark-ci/artifact-sizes.txt
          benchmark/build/outputs/connected_android_test_additional_output/
          benchmark/build/outputs/androidTest-results/
          benchmark/build/reports/androidTests/
          app/build/outputs/apk/standard/benchmarkRelease/*.apk

  ai-debug-validation:
    name: ai-debug-validation
    runs-on: ubuntu-latest
    # AI debug validation runs on trusted automation and optional manual dispatch.
    # It stays unsigned and never touches release signing secrets.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_release != true)

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate aiDebug
      run: ./gradlew :app:lintAiDebug :app:testAiDebugUnitTest :app:assembleAiDebug

  release-build:
    name: release-build
    runs-on: ubuntu-latest
    # Signed releases run only from version tag pushes or explicit manual dispatch.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.run_release == true)
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
        echo "storeFile=../app/release.jks" > keystore.properties
        echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build signed release variants
      run: ./gradlew :app:assembleStandardRelease :app:assembleAiRelease

    - name: Upload release APKs
      uses: actions/upload-artifact@v4
      with:
        name: release-apks
        path: |
          app/build/outputs/apk/standard/release/*.apk
          app/build/outputs/apk/ai/release/*.apk
